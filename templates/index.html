{% extends 'base.html' %}
{% block content %}

<a href="{{ url_for('create') }}" class="btn btn-primary mb-3">
    <i class="bi bi-plus-circle"></i> Nuevo Producto
</a>

<table class="table table-striped">
    <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for p in products %}
        <tr>
            <td>{{ p.id }}</td>
            <td>{{ p.name }}</td>
            <td>{{ p.price }}</td>
            <td>{{ p.stock }}</td>
            <td>
                <!-- READ ONE -->
                <a href="/product/{{ p.id }}" class="btn btn-info btn-sm"><i class="bi bi-eye"></i></a>

                <!-- UPDATE -->
                <a href="/edit/{{ p.id }}" class="btn btn-warning btn-sm"><i class="bi bi-pencil"></i></a>

                <!-- DELETE -->
                <a href="/delete/{{ p.id }}" class="btn btn-danger btn-sm"><i class="bi bi-trash"></i></a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
